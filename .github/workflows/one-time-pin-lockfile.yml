name: One-time pin baseline package-lock (remove after use)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  pin-lockfile-once:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/checkpoint-0-baseline-protection-20261105' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exactly the controlled feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4
        with:
          node-version: '22'

      - name: Resolve, verify, and commit one candidate lockfile to this branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "package-lock.json already tracked; no push is necessary."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm test
          npm run build
          git add -- package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(deps): pin tested Node 22 dependency graph"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
